[meta]
name = "policy_exploratory_synthetic_v1"
run_purpose = "exploratory"
full_campaign_config = false
full_exploratory_config = true
provenance_status = "illustrative"
notes = "This is an exploratory computational simulation using an illustrative, non-empirical projected population. Results are conditional on model assumptions; they are not empirical estimates, are not population-representative claims, and are not causal evidence about real-world players. Monetary outputs are model-equivalent amounts, not observed real-world spending. No real-world generalisation is permitted. Loading or validating this configuration does not initialize a cohort, execute a scenario, or authorize a production campaign; any later exploratory execution must retain all declared labels and blockers."

